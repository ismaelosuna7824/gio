name: CI

# Every push (except to main) and pull requests from forks: the SwiftPM test
# bundles, then an unsigned build of the Xcode app target. Nothing here needs
# Accessibility, Screen Recording, a signing identity or the user's config:
# tests use temp paths and fakes, and snapshot tests skip without
# GIO_SNAPSHOT_DIR.
#
# One run per commit: a pull request from a branch of this repository (the
# release PR from dev) is already tested by that branch's push, so its
# pull_request run is skipped (a skipped job counts as passing for the
# required check); a merge to main is tested by release.yml before it builds.
on:
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # The xcode-27 image (arm64, macOS 27): the app is developed with Xcode 27,
    # its icon is an Icon Composer document (Xcode 26+), and older toolchains
    # do not compile the sources (macos-15's Xcode 16.4 failed on main-actor
    # isolation and type checking). Same Xcode selection as release.yml.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the latest stable Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-xcode27-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-xcode27-

      # Serial, like local runs: the reconciler's lane tests measure real time
      # against 0.1-0.3 s budgets (--parallel on the runner's three cores
      # pushed slow-app writes past the stall). scripts/swift-test-ci.sh runs
      # a failed case once more on its own and flags it as a warning.
      - name: Test (all bundles)
        run: scripts/swift-test-ci.sh

      - name: Build the app (unsigned)
        run: |
          xcodebuild -project Gio.xcodeproj -scheme Gio -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/CIUnsigned \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
