name: CI

# Every branch and pull request: the SwiftPM test bundles, then an unsigned
# build of the Xcode app target. Nothing here needs Accessibility, Screen
# Recording, a signing identity or the user's config: tests use temp paths
# and fakes, and snapshot tests skip without GIO_SNAPSHOT_DIR.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    # Package.swift needs swift-tools-version 6.0 (Xcode 16+). macos-15 ships
    # it; macos-14 would need an explicit `sudo xcode-select -s` to an Xcode 16.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test (all bundles)
        run: swift test --parallel

      - name: Build the app (unsigned)
        run: |
          xcodebuild -project Gio.xcodeproj -scheme Gio -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/CIUnsigned \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
